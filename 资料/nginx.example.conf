server
{
    listen 80 default_server;
    server_name localhost;  #改成你的域名

    # --- 安全响应头 ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: ws: wss:;" always;
    add_header X-Download-Options "noopen" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Permission-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # COEP+COOP 启用 SharedArrayBuffer → Python IDE 死循环可中断(credentialless 兼容 CDN 资源)
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # --- 禁止访问源码映射文件 ---
    location ~* \.map$ {
        deny all;
        return 404;
    }

    # --- 禁止访问压缩包等敏感文件 ---
    location ~* \.(zip|rar|tar|tar\.gz|7z|sql)$ {
        deny all;
        return 404;
    }

    # --- 禁止访问敏感目录 ---
    location ~* /(logfiles|samples)/ {
        deny all;
        return 404;
    }

    # --- 禁止不安全的 HTTP 方法 ---
    if ($request_method ~* ^(TRACE|TRACK|PUT|DELETE|MOVE|COPY|PROPFIND|SEARCH|MKCOL|LOCK|UNLOCK|PROPPATCH)$) {
        return 405;
    }

    # index.html 禁止缓存:部署后老用户拿到过期入口会引用已删除的 hash chunk → 白屏
    # (location 内有 add_header 时不继承 server 级头,Cross-Origin 需重复)
    location = /index.html {
        root /www/wwwroot/localhost;  #网站前端位置
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    location / {
      index index.html index.htm;
      root /www/wwwroot/localhost;  #网站前端位置

      # try_files 而非 if(!-e) rewrite:构建产物 assets/ 目录会与前端 /assets 路由冲突
      # (目录存在时 if 判定"文件存在"→ 不回退 index.html → 403/404)
      try_files $uri /index.html;

      gzip on;
      gzip_min_length 1k;
      gzip_comp_level 9;
      gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
      gzip_vary on;
      gzip_disable "MSIE [1-6]\.";
    }

    location ^~ /api
    {
        expires 0;
        proxy_pass              http://127.0.0.1:8080/api/;
        proxy_set_header        Host 127.0.0.1;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;

        # 安全响应头（location 块中有 add_header 时不继承 server 级别的，需重复添加）
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: ws: wss:;" always;
        add_header X-Download-Options "noopen" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Permission-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # COEP+COOP 启用 SharedArrayBuffer → Python IDE 死循环可中断(credentialless 兼容 CDN 资源)
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header X-Cache $upstream_cache_status;
        add_header Cache-Control no-cache;
    }
}