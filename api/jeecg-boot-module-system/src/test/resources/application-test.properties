spring.datasource.url=jdbc:h2:mem:teaching;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.dynamic.enabled=false
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.timeout=3000
spring.redis.database=0
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
shiro.enabled=false
jeecg.shiro.excludeUrls=/**
jeecg.uploadType=local
jeecg.path.upload=/tmp/upload
jeecg.redis.password=
logging.level.org.jeecg=DEBUG
logging.level.org.springframework=WARN
jeecg.path.webapp=/tmp/webapp
