  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0px;
      padding: 0px;
    }

    .chromeframe {
      margin: 0.2em 0;
      background: #ccc;
      color: #000;
      padding: 0.2em 0;
    }

    #loader-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999999;
    }

    /* 滚动条优化 start */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f6f6f6;
      border-radius: 2px;
    }

    ::-webkit-scrollbar-thumb {
      background: #cdcdcd;
      border-radius: 2px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #747474;
    }

    ::-webkit-scrollbar-corner {
      background: #f6f6f6;
    }

    .load_title {
      font-family: 'Open Sans';
      color:#FFF;
      font-size: 18px;
      width: 100%;
      text-align: center;
      z-index: 9999999999999;
      position: absolute;
      top: 60%;
      opacity: 1;
      line-height: 30px;
    }

    /* 滚动条优化 end */
    #loading{
		background-color: #3498db;
		height: 100%;
		width: 100%;
		position: fixed;
		z-index: 1;
		margin-top: 0px;
		top: 0px;
	}
	#loading-center{
		width: 100%;
		height: 100%;
		position: relative;
		}
	#loading-center-absolute {
		position: absolute;
		left: 50%;
		top: 50%;
		height: 100px;
		width: 100px;
		margin-top: -50px;
		margin-left: -50px;
	}
	.object{
		position: absolute;
		height: 10px;
		width: 50px;		
		background-color: #FFF;
	}	
	.object:nth-child(2n+0) {
		-webkit-animation: animate_right 2s infinite;
		animation: animate_right 2s infinite;
	}
	.object:nth-child(2n+1) {
		-webkit-animation: animate_left 2s infinite;
		animation: animate_left 2s infinite;
	}		
	.object:nth-child(1){
		top: 0px;
		left: 0px;	
		}
	.object:nth-child(2){
		top: 0px;
		left: 50px;
		}
	.object:nth-child(3){
		top: 10px;
		left: 0px;	
		-webkit-animation-delay: 0.1s;
	    animation-delay: 0.1s;	
		}
	.object:nth-child(4){
		top: 10px;
		left: 50px;
		-webkit-animation-delay: 0.1s;
	    animation-delay: 0.1s;	
		}

		}

		}

	    animation-delay: 0.4s;
		}	
	.object:nth-child(11){
		top: 50px;

		-webkit-animation-delay: 0.5s;
	    animation-delay: 0.5s;
		}				
	.object:nth-child(12){

		}

		-webkit-animation-delay: 0.9s;
	    animation-delay: 0.9s;
		}
	@-webkit-keyframes animate_right {
	50% {
		-ms-transform: translate(200px,-200px) rotate(180deg); 
	   	-webkit-transform: translate(200px,-200px) rotate(180deg); 
	    transform: translate(200px,-200px) rotate(180deg); 
	  }
	}
	@keyframes animate_right {
	50% {
		-ms-transform: translate(200px,-200px) rotate(180deg); 
	   	-webkit-transform: translate(200px,-200px) rotate(180deg); 
	    transform: translate(200px,-200px) rotate(180deg); 
	  }
	}
	@-webkit-keyframes animate_left {
	50% {
		-ms-transform: translate(-200px,-200px) rotate(180deg); 
	   	-webkit-transform: translate(-200px,-200px) rotate(180deg); 
	    transform: translate(-200px,-200px) rotate(180deg); 
	  }
	}

	@keyframes animate_left {

	50% {
		-ms-transform: translate(-200px,-200px) rotate(180deg); 
	   	-webkit-transform: translate(-200px,-200px) rotate(180deg); 
	    transform: translate(-200px,-200px) rotate(180deg); 
	  }
	}
