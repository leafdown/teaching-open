<!DOCTYPE html>
<html lang="zh-cmn-Hans">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Teaching</title>
  <link rel="icon" href="<%= BASE_URL %>logo.png">
  <script src="/js/polyfill.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HPJJESN3X4"></script>

  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0px;
      padding: 0px;
    }

    .outer {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #F7F7F8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .loader-logo {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      background: #2563EB;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .loader-logo::after {
      content: '';
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loader-text {
      font-size: 16px;
      font-weight: 600;
      color: #18181B;
      letter-spacing: 0.02em;
    }

    .loader-subtext {
      font-size: 13px;
      color: #71717A;
      margin-top: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
      background: url(./img/body.png) no-repeat center center;
      background-size: contain;
      z-index: 10;
    }

  </style>
  <!-- 全局配置 -->

    //window._CONFIG['staticDomainURL'] = ' https://lanqu-teacher.oss-cn-hangzhou.aliyuncs.com';

    window._CONFIG['defaultUploadType'] = 'qiniu' //local本地 qiniu七牛
    window._CONFIG['qn_base'] = "https://storage.lanqu.vip/" //七牛云存储地址

    window._CONFIG['brandDesc'] = "让孩子用代码书写创意" //品牌介绍
    window._CONFIG['beian'] = "浙ICP备19028248号-1 浙ICP备19028248号-2 浙公安网备33010502005665号" //备案号
