<!DOCTYPE html>
<html lang="zh-cmn-Hans">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Teaching</title>
  <link rel="icon" href="<%= BASE_URL %>logo.png">
  <script src="/js/polyfill.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HPJJESN3X4"></script>
  <script src="/js/common.js"></script>
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0px;
      padding: 0px;
    }

    .outer {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #fff6e3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main {
      position: relative;
    }

    .dragon {
      width: 200px;
      height: 140px;
      transform-origin: 50% 80%;
      animation: zoomIn .5s cubic-bezier(0.47, 0, 0.75, 0.72) infinite alternate;
    }

    .dragon .body {
      position: absolute;
      top: 0;
      right: 0;
      width: 180px;
      height: 128px;
      background: url(./img/body.png) no-repeat center center;
      background-size: contain;
      z-index: 10;
    }

    .dragon .horn-left {
      position: absolute;
      top: -17px;
      left: 32px;
      width: 31px;
      height: 31px;
      background: url(./img/horn-left.png) no-repeat;
      background-size: contain;
      z-index: 9;
      transform-origin: 150% 200%;
      transform: rotate(-5deg);
      animation: swingRight .5s cubic-bezier(0.47, 0, 0.75, 0.72) infinite alternate;
    }

    .dragon .horn-right {
      position: absolute;
      top: -16px;
      left: 110px;
      width: 34px;
      height: 31px;
      background: url(./img/horn-right.png) no-repeat;
      background-size: contain;
      z-index: 9;
      transform-origin: -50% 200%;
      transform: rotate(5deg);
      animation: swingLeft .5s cubic-bezier(0.47, 0, 0.75, 0.72) infinite alternate;
    }

    .dragon .eye {
      position: absolute;
      top: 39px;
      width: 11px;
      height: 11px;
      background: url(./img/eye.png) no-repeat;
      background-size: contain;
      z-index: 12;
    }

    .dragon .eye.left {
      left: 49px;
    }

    .dragon .eye.right {
      left: 118px;
      transform-origin: 50% 50%;
      transform: rotate(180deg);
    }

    .dragon .blush {
      position: absolute;
      top: 46px;
      width: 15px;
      height: 9px;
      background: url(./img/blush.png) no-repeat;
      background-size: 100% 100%;
      z-index: 11;
      animation: blush .5s ease infinite alternate;
    }

    .dragon .blush.left {
      left: 43px;
    }

    .dragon .blush.right {
      left: 120px;
    }

    .dragon .mouth {
      position: absolute;
      top: 52px;
      left: 49px;
      width: 78px;
      height: 56px;
      background: url(./img/mouth.png) no-repeat;
      background-size: 100%;
      z-index: 11;
      animation: openMouth 1s ease infinite;
    }

    .dragon .tail-sting {
      position: absolute;
      top: 67px;
      left: 139px;
      width: 40px;
      height: 38px;
      background: url(./img/tail-sting.png) no-repeat;
      background-size: contain;
      z-index: 9;
      transform-origin: 0 100%;
      animation: tailUp .5s cubic-bezier(0.47, 0, 0.75, 0.72) infinite alternate;
    }

    .shadow-wrapper {
      position: absolute;
      top: 110px;
      width: 100%;
    }

    .shadow {
      margin: 0 auto;
      width: 110px;
      height: 30px;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 50%;
      z-index: 0;
      animation: zoomIn .5s cubic-bezier(0.47, 0, 0.75, 0.72) infinite alternate;
    }

    .fire-wrapper {
      position: absolute;
      width: 40px;
      top: 60px;
      left: 88px;
      transform: translate(-50%, -50%);
      transform-origin: 50% 100%;
      animation: fireUp 1s ease-in infinite;
    }

    .fire {
      padding-bottom: 135%;
      width: 100%;
      height: 100%;
      background: url(./img/fire.png) no-repeat;
      background-size: contain;
      animation: fire 1s ease-out infinite;
    }

    .progress {
      margin-top: 30px;
      width: 100%;
    }

    .progress .outer {
      width: 100%;
      height: 14px;
      border-radius: 7px;
      background: rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .progress .inner {
      width: 0;
      height: 100%;
      background: #ffcd33;
      animation: loading 2s linear infinite;
    }

    @keyframes zoomIn {
      100% {
        transform: scale(1.16, 1.16);
      }
    }

    @keyframes swingRight {
      100% {
        transform: rotate(5deg);
      }
    }

    @keyframes swingLeft {
      100% {
        transform: rotate(-5deg);
      }
    }

    @keyframes blush {
      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

    @keyframes openMouth {
      0% {
        -webkit-clip-path: ellipse(20% 0% at 50% 0);
        clip-path: ellipse(20% 0% at 50% 0);
      }

      50% {
        -webkit-clip-path: ellipse(100% 100% at 50% 0);
        clip-path: ellipse(100% 100% at 50% 0);
      }

      70% {
        -webkit-clip-path: ellipse(100% 100% at 50% 0);
        clip-path: ellipse(100% 100% at 50% 0);
      }

      100% {
        -webkit-clip-path: ellipse(20% 0% at 50% 0);
        clip-path: ellipse(20% 0% at 50% 0);
      }
    }

    @keyframes tailUp {
      0% {
        transform: scaleY(0.9);
      }

      100% {
        transform: scaleY(1.06);
      }
    }

    @keyframes loading {
      100% {
        width: 100%;
      }
    }

    @keyframes fireUp {
      0% {
        top: 70px;
      }

      20% {
        top: 70px;
      }

      100% {
        top: -80px;
      }
    }

    @keyframes fire {
      0% {
        transform: scale(0, 0);
        opacity: 0.8;
      }

      20% {
        transform: scale(0, 0);
        opacity: 0.8;
      }

      50% {
        opacity: 0.8;
      }

      100% {
        transform: scale(1, 1);
        opacity: 0;
      }
    }
  </style>
  <!-- 全局配置 -->
  <script>
    window._CONFIG = {};
    window._CONFIG['domianURL'] = window.location.protocol + '//' + window.location.hostname + (window.location.port ?
      ':' + window.location.port : '') + '/api';
    window._CONFIG['webURL'] = window.location.protocol + '//' + window.location.hostname + (window.location.port ?
      ':' + window.location.port : '')
    window._CONFIG['casPrefixUrl'] = 'http://cas.example.org:8443/cas';
    window._CONFIG['onlinePreviewDomainURL'] = 'http://fileview.jeecg.com/onlinePreview'
    window._CONFIG['staticDomainURL'] = window._CONFIG['domianURL'] + '/sys/common/static/';
    window._CONFIG['staticDomainURL'] = ' https://lanqu-teacher.oss-cn-hangzhou.aliyuncs.com';
    window._CONFIG['pdfDomainURL'] = window._CONFIG['domianURL'] + '/sys/common/pdf/pdfPreviewIframe';
    window._CONFIG['defaultUploadType'] = 'qiniu' //local本地 qiniu七牛
    window._CONFIG['qn_base'] = "https://storage.lanqu.vip/" //七牛云存储地址
    window._CONFIG['lanqu_base'] = "https://storage.lanqu.vip/" //蓝趣角色
    window._CONFIG['qn_area'] = 'cn-east-2' //七牛区域 z0：华东 z1：华北 z2：华南 na0：北美 as0：东南亚 cn-east-2：华东-浙江2
    window._CONFIG['brandName'] = "蓝趣编程课堂" //品牌名
    window._CONFIG['brandDesc'] = "让孩子用代码书写创意" //品牌介绍
    window._CONFIG['beian'] = "浙ICP备19028248号-1 浙ICP备19028248号-2 浙公安网备33010502005665号" //备案号
    localStorage.setItem("CONFIG", JSON.stringify(window._CONFIG))
    window.document.title = window._CONFIG['brandName']
  </script>
</head>

<body>
  <!-- built files will be auto injected -->
  <div id="app">
    <div class="outer">
      <div class="main">
        <div class="shadow-wrapper">
          <div class="shadow"></div>
        </div>
        <div class="dragon">
          <div class="body"></div>
          <div class="horn-left"></div>
          <div class="horn-right"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="blush left"></div>
          <div class="blush right"></div>
          <div class="mouth"></div>
          <div class="tail-sting"></div>
        </div>
        <div class="fire-wrapper">
          <div class="fire"></div>
        </div>
        <div class="progress">
          <div class="outer">
            <div class="inner"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
