<!DOCTYPE html>
<html>

<head>
    <meta charset=utf-8>
    <meta charset="UTF-8">
    <meta property="og:title" content="pyonline">
    <meta name="theme" content="dark">
    <meta name="keywords" content="pyonline">
    <meta name="renderer" content="webkit"/>
    <meta name="force-rendering" content="webkit"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>蓝趣Python在线编程</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.qrcode/1.0/jquery.qrcode.min.js"></script>
    <script src="../js/qiniu.min.js"></script>
    <script src="../js/common.js"></script>
    
    <link rel=icon href=../logo.png>

</head>
<body>
    <div class="ctlPanel" style="visibility: hidden;width: 0%;height: 0%;">
        <span class="ctlbtn" onclick="runCode()"> <i class="fa fa-caret-right"></i> 运行</span>
        <input id='projectName' placeholder="请输入项目名称" type="text" class="ctlbtn" style="width: 0px;">
    </div>
    <div class="mainContainer" id="mctn" style="height: calc(100vh - 20px);">
        <div class="leftContainer" id="editorContainer" style="visibility: hidden;width: 0%;min-width:0px"></div>
        <div class="rightContainer"  style="width:100%;height: 100%;">
          <pre id="outputContainer" title="程序输出"style="height: calc(40% - 10px);" ></pre>
          <div id="turtleCanvas" title="海龟图" style="height: 60%;"></div> 
        </div>
    </div>
</body>
<footer>
  <!--    require.js解决Can only have one anonymous define call per script file问题-->
      <script src="https://requirejs.org/docs/release/2.3.6/minified/require.js"></script>
      <script src="https://cdn.jsdelivr.net/gh/skulpt/skulpt-dist/skulpt.js"></script>
      <script src="https://cdn.jsdelivr.net/gh/skulpt/skulpt-dist/skulpt-stdlib.js"></script>
      <script src="https://cdnjs.loli.net/ajax/libs/monaco-editor/0.9.0/min/vs/loader.js"></script>
      <script src="script_player.js"></script>

</footer>
</html>
