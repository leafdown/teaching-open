<!DOCTYPE html>
<html lang="zh-cmn-Hans">
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="pyonline">

    <meta name="renderer" content="webkit"/>

    <title>蓝趣Python在线编程</title>
    <link rel="stylesheet" href="../css/loading.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.qrcode/1.0/jquery.qrcode.min.js"></script>
    <script src="../js/qiniu.min.js"></script>
    <script src="../js/common.js"></script>
    
    <link rel=icon href=../logo.png>

</head>
<body>
  <div id="loading">
		<div id="loading-center">
			<div id="loading-center-absolute">
				<div class="object" id="object_one"></div>
				<div class="object" id="object_two"></div>
				<div class="object" id="object_three"></div>
				<div class="object" id="object_four"></div>
				<div class="object" id="object_five"></div>
				<div class="object" id="object_six"></div>
				<div class="object" id="object_seven"></div>
				<div class="object" id="object_eight"></div>
				<div class="object" id="object_big"></div>
			</div>
		</div>
	</div>
    <div class="desc">
        <p id="title"><i class="fa fa-code"></i>蓝趣Python在线编程</p>
    </div>
    <div class="ctlPanel">
        <span class="ctlbtn" onclick="runCode()"> <i class="fa fa-caret-right"></i> 运行</span>
        <span class="ctlbtn" onclick="saveCode()"> <i class="fa fa-save"></i> 保存</span>
        <span class="ctlbtn" onclick="submitTo()"> <i class="fa fa-save"></i> 提交</span>
        <input id='projectName' placeholder="请输入项目名称" type="text" class="ctlbtn" style="width: 200px;">
    </div>
    <div class="mainContainer" id="mctn">
        <div class="leftContainer" id="editorContainer"></div>
        <div class="rightContainer">
            <pre id="outputContainer" title="程序输出"></pre>
            <div id="turtleCanvas" title="海龟图"></div>
        </div>
    </div>

</body>
<footer>
